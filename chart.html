\u002f12) 전후 BTC도 큰 폭 하락. 연준은 3\u002f3·3\u002f15 긴급 인하로 사실상 0%대 금리를 복원하고 대규모 유동성 지원을 발표.","\u003cb\u003e비트코인 3차 반감기\u003c\u002fb\u003e\u003cbr\u003e2020-05-11\u003cbr\u003e[crypto, sev 4]\u003cbr\u003e블록 보상 12.5→6.25 BTC. 이후 기관 매수·유동성 확대와 맞물려 2020–21 강세장의 공급 측 배경으로 자주 인용.","\u003cb\u003e테슬라, 비트코인 약 $15억 매입 공시\u003c\u002fb\u003e\u003cbr\u003e2021-02-08\u003cbr\u003e[crypto, sev 4]\u003cbr\u003e테슬라가 SEC 공시로 약 15억 달러 상당 BTC 매입과 향후 결제 수용 가능성을 밝히며 기관 채택 내러티브를 강화.","\u003cb\u003e중국, 암호화폐 거래·관련 활동 전면 불법화\u003c\u002fb\u003e\u003cbr\u003e2021-09-24\u003cbr\u003e[policy, sev 4]\u003cbr\u003e인민은행 등 당국이 암호화폐 관련 업무를 불법으로 규정·단속을 강화. 채굴·거래 단속이 이어지며 단기 가격·해시레이트에 충격.","\u003cb\u003e미국 첫 비트코인 선물 ETF(BITO) 상장\u003c\u002fb\u003e\u003cbr\u003e2021-10-19\u003cbr\u003e[crypto, sev 3]\u003cbr\u003eProShares Bitcoin Strategy ETF(BITO)가 NYSE Arca에서 거래 개시. 현물 ETF는 아직 불허이나, 규제된 ETF 형태로 BTC 노출을 제공한 이정표.","\u003cb\u003e2021년 사이클 고점(~$69k)\u003c\u002fb\u003e\u003cbr\u003e2021-11-10\u003cbr\u003e[markets, sev 4]\u003cbr\u003e기관 매수·유동성 호황 속 비트코인이 약 $69,000대 고점을 기록한 뒤 2022 약세로 전환.","\u003cb\u003e연준 긴축 사이클(2022–2023)\u003c\u002fb\u003e\u003cbr\u003e2022-03-16 ~ 2023-07-26\u003cbr\u003e[fed, sev 5]\u003cbr\u003e인플레 대응으로 2022-03-16 첫 인상 이후 약 16개월간 공격적 인상. 연방기금금리 목표 상단이 2023-07 5.25–5.50%까지 상승. 리스크자산·암호화폐에 강한 매크로 역풍.","\u003cb\u003eTerra\u002fLUNA·UST 붕괴\u003c\u002fb\u003e\u003cbr\u003e2022-05-09 ~ 2022-05-13\u003cbr\u003e[crypto, sev 5]\u003cbr\u003e알고리즘 스테이블코인 UST 디페그 → LUNA 초인플레이션·생태계 붕괴. 수십억 달러 규모 손실과 연쇄 청산으로 업계 신뢰·유동성에 큰 타격.","\u003cb\u003eFTX 파산\u003c\u002fb\u003e\u003cbr\u003e2022-11-11\u003cbr\u003e[crypto, sev 5]\u003cbr\u003e유동성 위기·고객 자산 유용 의혹 속 FTX 등 계열사가 Chapter 11 신청(11\u002f11). SBF 사임, John J. Ray III 신임 CEO. 업계 신뢰 추락과 함께 BTC가 다년 저점 부근으로 하락.","\u003cb\u003e실리콘밸리은행(SVB) 파산\u003c\u002fb\u003e\u003cbr\u003e2023-03-10\u003cbr\u003e[markets, sev 4]\u003cbr\u003e캘리포니아 당국이 SVB를 폐쇄하고 FDIC를 관재인으로 지정. 지역은행 불안과 유동성 우려 속에 BTC는 상대적으로 강세를 보이며 '유동성\u002f헤지' 내러티브가 부각.","\u003cb\u003e블랙록, 현물 비트코인 ETF 신청\u003c\u002fb\u003e\u003cbr\u003e2023-06-15\u003cbr\u003e[crypto, sev 3]\u003cbr\u003e세계 최대 자산운용사 블랙록의 현물 BTC ETF 신청이 보도되며 승인 기대가 재점화. 이후 다수 운용사 신청·법원 판결이 2024-01 승인으로 이어짐.","\u003cb\u003eSEC, 미국 현물 비트코인 ETF 승인\u003c\u002fb\u003e\u003cbr\u003e2024-01-10 ~ 2024-01-11\u003cbr\u003e[crypto, sev 5]\u003cbr\u003e2024-01-10 SEC가 다수 현물 BTC ETP 상장·거래를 승인. 익일부터 BlackRock·Fidelity·Grayscale 등 상품 거래 개시. 기관 접근성 확대의 핵심 이정표.","\u003cb\u003e비트코인 4차 반감기\u003c\u002fb\u003e\u003cbr\u003e2024-04-19 ~ 2024-04-20\u003cbr\u003e[crypto, sev 4]\u003cbr\u003e블록 보상 6.25→3.125 BTC. 로이터 등 보도는 2024-04-19 전후로 반감기 완료를 전함. 현물 ETF 유입과 맞물린 공급 충격으로 해석.","\u003cb\u003e연준 금리 인하 사이클 개시(2024)\u003c\u002fb\u003e\u003cbr\u003e2024-09-18 ~ 2024-12-18\u003cbr\u003e[fed, sev 4]\u003cbr\u003e2024-09-18 첫 50bp 인하(목표 4.75–5.00%)로 긴축 사이클에서 완화로 선회. 이후 11월·12월에도 각 25bp 인하(연준 공개 자료).","\u003cb\u003e트럼프 2024 대선 승리\u003c\u002fb\u003e\u003cbr\u003e2024-11-05\u003cbr\u003e[policy, sev 4]\u003cbr\u003e친크립토 공약을 내건 도널드 트럼프가 대선에서 승리. 규제 완화·전략비축 등 기대가 겹치며 BTC 강세가 이어짐.","\u003cb\u003e비트코인 첫 $100,000 돌파\u003c\u002fb\u003e\u003cbr\u003e2024-12-05\u003cbr\u003e[markets, sev 4]\u003cbr\u003e대선 이후 랠리 속에서 BTC가 사상 처음 $100,000을 돌파했다는 주요 언론 보도.","\u003cb\u003e트럼프 2기 취임\u003c\u002fb\u003e\u003cbr\u003e2025-01-20\u003cbr\u003e[policy, sev 3]\u003cbr\u003e2025-01-20 취임. 취임 전후 BTC가 다시 $100k 부근 고점을 기록했다는 보도와 함께, 이후 관세·연준·중동 이슈가 시장을 지배.","\u003cb\u003e해방의 날(Liberation Day) 상호관세\u003c\u002fb\u003e\u003cbr\u003e2025-04-02 ~ 2025-04-09\u003cbr\u003e[policy, sev 5]\u003cbr\u003e트럼프가 2025-04-02를 'Liberation Day'로 선언하고 EO 14257로 광범위한 상호관세를 부과. 기본 10%(4\u002f5 발효)와 국가별 가산(4\u002f9) 구조. 이후 협상·유예·보복이 이어지며 리스크자산 변동성 확대.","\u003cb\u003e2025년 신고점(일봉 종가 기준 ~$124k)\u003c\u002fb\u003e\u003cbr\u003e2025-10-06\u003cbr\u003e[markets, sev 3]\u003cbr\u003e이 패키지 Binance 일봉 CSV 기준, 종가 최고일이 2025-10-06(약 $124,659). 외부 보도의 순간 고점과 일봉 종가는 다를 수 있음.","\u003cb\u003e미·이스라엘–이란 전쟁 및 호르무즈 해협 통행 교란\u003c\u002fb\u003e\u003cbr\u003e2026-02-28 ~ 진행중\u003cbr\u003e[geo, sev 5]\u003cbr\u003e2026-02-28 미·이스라엘의 이란 공습으로 전쟁이 시작됐고, 이란은 호르무즈 통행 경고·공격 등으로 사실상 심각한 해상 교란을 초래했다. 완전·영구 봉쇄라기보다 통행량이 급감하고 미국이 이란 항만 봉쇄를 병행한 ‘실질적 폐쇄·교란’ 국면이 2026-09 현재까지 이어지고 있다.","\u003cb\u003e트럼프, 케빈 워시 연준 의장 지명\u003c\u002fb\u003e\u003cbr\u003e2026-03-04\u003cbr\u003e[fed, sev 3]\u003cbr\u003e트럼프 대통령이 케빈 워시를 연준 의장으로 지명. 이후 상원 인준·5\u002f22 취임으로 이어짐.","\u003cb\u003e미·이란 2주 휴전(4월)\u003c\u002fb\u003e\u003cbr\u003e2026-04-07 ~ 2026-04-21\u003cbr\u003e[geo, sev 4]\u003cbr\u003e4\u002f7–8경 트럼프가 조건부로 2주 휴전을 수용. 호르무즈 상업 통행 조율이 핵심 조건 중 하나였으나 장기 평화로 이어지지 못함.","\u003cb\u003e미 장기금리 급등·리스크자산 압박(4월 말)\u003c\u002fb\u003e\u003cbr\u003e2026-04-30\u003cbr\u003e[markets, sev 3]\u003cbr\u003e이란전·유가 충격으로 인플레·금리 우려가 커지며 미 30년물 등이 5%대에 근접\u002f도달했다는 보도와 함께 비트코인 등 리스크자산 경계가 강화됨.","\u003cb\u003e케빈 워시 연준 의장 취임\u003c\u002fb\u003e\u003cbr\u003e2026-05-22\u003cbr\u003e[fed, sev 4]\u003cbr\u003e케빈 워시가 연준 이사회·FOMC 의장으로 취임(백악관 선서). 이후 9월 인상 등 통화정책 기조 전환의 배경.","\u003cb\u003e트럼프, 호르무즈 재개 이란 합의 '대체로 협상됨' 발언\u003c\u002fb\u003e\u003cbr\u003e2026-05-23 ~ 2026-05-26\u003cbr\u003e[geo, sev 4]\u003cbr\u003e5월 말 트럼프가 이란과의 해협 재개·평화 합의가 상당 부분 협상됐다고 밝히며 유가·리스크자산 변동. 이후 신규 공습 보도로 낙관이 빠르게 후퇴.","\u003cb\u003e미·이란 이슬라마바드 MoU(60일 휴전·호르무즈 조항)\u003c\u002fb\u003e\u003cbr\u003e2026-06-17 ~ 2026-08-17\u003cbr\u003e[geo, sev 5]\u003cbr\u003e파키스탄 중재 14개조 MoU로 군사행동 중단과 호르무즈 통행 복원 노력, 제재·재건 패키지 협상을 약속. 항로 해석 갈등·상선 피격으로 한 달 내 사실상 붕괴, 8\u002f17 공식 만료.","\u003cb\u003e호르무즈 탱커 통행 한 자릿수(전쟁 후 최저 수준)\u003c\u002fb\u003e\u003cbr\u003e2026-09-11\u003cbr\u003e[geo, sev 4]\u003cbr\u003e로이터 선박추적: 일일 통행이 한 자릿수로 하락. 전쟁 전 약 125척\u002f일 대비 극심한 위축.","\u003cb\u003e사우디 송유관·호르무즈 공격으로 유가 재상승 우려\u003c\u002fb\u003e\u003cbr\u003e2026-09-13\u003cbr\u003e[geo, sev 4]\u003cbr\u003e사우디 동서 송유관 등 공격과 호르무즈·홍해 위협이 겹치며 유가가 $100 위로 재상승할 것이라는 시장 기대가 커짐.","\u003cb\u003e미 상원, CLARITY Act(암호화폐 시장구조법) 부결\u003c\u002fb\u003e\u003cbr\u003e2026-09-15\u003cbr\u003e[crypto, sev 4]\u003cbr\u003e트럼프가 지지한 디지털자산 시장구조법(Clarity Act)이 상원에서 60표 문턱을 넘지 못함. 비트코인 당일 5% 이상 하락 보도.","\u003cb\u003e연준, 2023년 이후 첫 기준금리 인상(+25bp)\u003c\u002fb\u003e\u003cbr\u003e2026-09-16\u003cbr\u003e[fed, sev 5]\u003cbr\u003eFOMC가 연방기금금리 목표를 3.75–4.00%로 25bp 인상(만장일치). 워시 의장 체제 첫 긴축.","\u003cb\u003e트럼프–시진핑 회담·미중 관세 휴전 연장(1\u002f10까지)\u003c\u002fb\u003e\u003cbr\u003e2026-09-24 ~ 2026-09-25\u003cbr\u003e[policy, sev 3]\u003cbr\u003e시진핑 방미·정상회담 전후로 관세 휴전이 2027-01-10로 연장. 즉각 관세 재인상은 피했으나 희토류·농업·기술 쟁점은 미해결.","\u003cb\u003e이란, 7일 내 호르무즈 재개 제안(미 응답 대기)\u003c\u002fb\u003e\u003cbr\u003e2026-09-25 ~ 진행중\u003cbr\u003e[geo, sev 4]\u003cbr\u003e아라그치 외교장관이 미 이란항 봉쇄 해제·석유제재 완화 등을 조건으로 7일 내 해협 정상화 제안. WSJ는 트럼프 거부 보도; 이란은 공식 미 응답을 기다림.","\u003cb\u003eCENTCOM, 이란 항만 봉쇄로 122척 우회 조치 발표\u003c\u002fb\u003e\u003cbr\u003e2026-09-25\u003cbr\u003e[geo, sev 3]\u003cbr\u003e미 중부사령부가 이란 항만 입출항 봉쇄 집행 과정에서 상업선 122척을 우회시켰다고 발표(9\u002f25 기준)."],"hovertemplate":"%{customdata}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"color":["#9b59b6","#f39c12","#f39c12","#e67e22","#9b59b6","#9b59b6","#1abc9c","#9b59b6","#f39c12","#3498db","#9b59b6","#9b59b6","#f39c12","#9b59b6","#9b59b6","#9b59b6","#3498db","#1abc9c","#f39c12","#1abc9c","#1abc9c","#f39c12","#e74c3c","#3498db","#e74c3c","#f39c12","#3498db","#e74c3c","#e74c3c","#e74c3c","#e74c3c","#9b59b6","#3498db","#1abc9c","#e74c3c","#e74c3c"],"line":{"color":"white","width":0.5},"size":[9,12,12,12,12,12,12,9,12,12,12,12,12,9,12,12,12,12,12,9,12,9,12,9,12,9,12,12,12,12,12,12,12,9,12,9],"symbol":"triangle-up"},"mode":"markers+text","name":"이벤트","text":["","2017년 강세장 고점(~$20k)","2018 암호화폐 겨울(약세장)","COVID-19 충격·연준 긴급 완화","비트코인 3차 반감기","테슬라, 비트코인 약 $15억 매입 공시","중국, 암호화폐 거래·관련 활동 전면 불법화","","2021년 사이클 고점(~$69k)","연준 긴축 사이클(2022–2023)","Terra\u002fLUNA·UST 붕괴","FTX 파산","실리콘밸리은행(SVB) 파산","","SEC, 미국 현물 비트코인 ETF 승인","비트코인 4차 반감기","연준 금리 인하 사이클 개시(2024)","트럼프 2024 대선 승리","비트코인 첫 $100,000 돌파","","해방의 날(Liberation Day) 상호관세","","미·이스라엘–이란 전쟁 및 호르무즈 해협 통행 교란","","미·이란 2주 휴전(4월)","","케빈 워시 연준 의장 취임","트럼프, 호르무즈 재개 이란 합의 '대체로 협상됨' 발언","미·이란 이슬라마바드 MoU(60일 휴전·호르무즈 조항)","호르무즈 탱커
